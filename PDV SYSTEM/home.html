<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV KATEC</title>
    <!-- Importando a fonte moderna Montserrat do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./css/home.css">
</head>
<body>

    <!-- HOTBAR (MENU) -->
    <nav class="hotbar">
        <a href="./home.html" class="menu-item">Início</a>
        <a href="./venda.html" class="menu-item">Venda</a>
        <a href="./estoque.html" class="menu-item">Estoque</a> 
    </nav>

    <!-- INÍCIO -->
    <main class="inicio">
        <!-- TÍTULO -->
        <h1>Bem vindo ao seu<br> <span>SISTEMA PDV KATEC</span></h1>
        
        <!-- CONTAINER DA LOGO PARA O EFEITO DE GIRO -->
        <div class="logo-container">
            <img src="./image/logo.png" alt="Logo do Sistema PDV KATEC" class="logo">
        </div>
    </main>
    
    
  <script src="./js/sistema.js"></script>

<section class="loja-box" aria-label="Gerenciamento da loja">
  <h2>Minha Loja</h2>
  <p id="status-loja">Nenhuma loja carregada.</p>
  <div class="loja-acoes">
    <button id="btn-carregar-loja" type="button">📂 Carregar minha loja</button>
    <button id="btn-nova-loja" type="button">➕ Criar loja</button>
  </div>
</section>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const status = document.getElementById('status-loja');
  const carregar = document.getElementById('btn-carregar-loja');
  const nova = document.getElementById('btn-nova-loja');

  carregar?.addEventListener('click', async () => {
    try {
      const s = await PDVSistema.carregarLoja();
      status.textContent = `Loja carregada: ${s.loja.nome} — ${s.estoque.length} produtos e ${s.vendas.length} vendas.`;
      alert('Loja carregada com sucesso!');
    } catch (e) {
      if (e?.name !== 'AbortError') alert(e.message || 'Não foi possível carregar a loja.');
    }
  });

  nova?.addEventListener('click', async () => {
    try {
      const s = await PDVSistema.criarNovaLoja();
      status.textContent = `Nova loja criada: ${s.loja.nome}.`;
      alert('Arquivo da nova loja criado com sucesso!');
    } catch (e) {
      if (e?.name !== 'AbortError') alert(e.message || 'Não foi possível criar a loja.');
    }
  });

  document.addEventListener('pdv:sistema-carregado', (e) => {
    const s = e.detail;
    status.textContent = `Loja carregada: ${s.loja.nome} — ${s.estoque.length} produtos e ${s.vendas.length} vendas.`;
  });
});
</script>

</body>
</html>
